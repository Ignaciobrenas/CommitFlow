<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="24" height="24">
  <!-- CommitFlow Official Monochromatic Isotype for Activity Bar / Panel -->
  <g fill="none" stroke="currentColor" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top-left fork leading to upper solid node -->
    <path d="M 135 224 C 155 185, 210 195, 210 140 L 210 115" />
    <circle cx="210" cy="110" r="16" fill="currentColor" stroke="none" />

    <!-- Top center arc with arrow head -->
    <path d="M 242 220 C 242 145, 285 135, 338 135" />
    <polygon points="325,103 368,135 325,167" fill="currentColor" stroke="none" />

    <!-- Top right wavy branch -->
    <path d="M 278 232 C 295 185, 345 198, 375 155" />

    <!-- Left to Center arrow -->
    <path d="M 162 256 L 208 256" />
    <polygon points="196,226 236,256 196,286" fill="currentColor" stroke="none" />

    <!-- Center to Right arrow -->
    <path d="M 288 256 L 332 256" />
    <polygon points="320,226 362,256 320,286" fill="currentColor" stroke="none" />

    <!-- Center to Bottom arrow -->
    <path d="M 242 272 L 242 325" />
    <polygon points="212,314 242,356 272,314" fill="currentColor" stroke="none" />

    <!-- Bottom right branch -->
    <path d="M 268 380 C 300 375, 290 330, 320 315 C 345 302, 350 290, 348 274" />

    <!-- Main Git Nodes -->
    <circle cx="128" cy="256" r="24" stroke-width="20" fill="none" />
    <circle cx="256" cy="256" r="23" stroke-width="20" fill="none" />
    <circle cx="392" cy="135" r="24" stroke-width="20" fill="none" />
    <circle cx="238" cy="382" r="23" stroke-width="20" fill="none" />
  </g>
</svg>
