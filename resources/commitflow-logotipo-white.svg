<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 512" width="100%" height="100%">
  <!-- Logotipo completo (Imagotipo: Isotipo + Texto) en blanco plano sin fondo -->
  
  <!-- ISOTIPO -->
  <g fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- 1. Rama superior izquierda -->
    <path d="M 135 224 C 155 185, 210 195, 210 140 L 210 115" />
    <circle cx="210" cy="110" r="16" fill="#FFFFFF" stroke="none" />

    <!-- 2. Arco superior central con punta de flecha -->
    <path d="M 242 220 C 242 145, 285 135, 338 135" />
    <polygon points="325,103 368,135 325,167" fill="#FFFFFF" stroke="none" />

    <!-- 3. Rama ondulada superior derecha -->
    <path d="M 278 232 C 295 185, 345 198, 375 155" />

    <!-- 4. Flecha horizontal izquierda -> centro -->
    <path d="M 162 256 L 208 256" />
    <polygon points="196,226 236,256 196,286" fill="#FFFFFF" stroke="none" />

    <!-- 5. Flecha horizontal centro -> derecha -->
    <path d="M 288 256 L 332 256" />
    <polygon points="320,226 362,256 320,286" fill="#FFFFFF" stroke="none" />

    <!-- 6. Flecha vertical centro -> abajo -->
    <path d="M 242 272 L 242 325" />
    <polygon points="212,314 242,356 272,314" fill="#FFFFFF" stroke="none" />

    <!-- 7. Rama ondulada inferior derecha -->
    <path d="M 268 380 C 300 375, 290 330, 320 315 C 345 302, 350 290, 348 274" />

    <!-- NODOS PRINCIPALES -->
    <circle cx="128" cy="256" r="24" stroke-width="20" fill="none" />
    <circle cx="256" cy="256" r="23" stroke-width="20" fill="none" />
    <circle cx="392" cy="135" r="24" stroke-width="20" fill="none" />
    <circle cx="238" cy="382" r="23" stroke-width="20" fill="none" />
  </g>

  <!-- TEXTO (LOGOTIPO) -->
  <g fill="#FFFFFF" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif">
    <text x="455" y="240" font-size="115" font-weight="800" letter-spacing="4">COMMIT</text>
    <text x="455" y="365" font-size="115" font-weight="300" letter-spacing="10">FLOW</text>
  </g>
</svg>